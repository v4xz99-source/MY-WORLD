<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom)}

.wrap{max-width:880px;margin:0 auto;padding:0 16px 60px}
.banner{height:clamp(170px,40vw,300px);position:relative;overflow:hidden;background:linear-gradient(120deg,#0c0c0e,#2b2b34,#0a0a0c,#3b3b47);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
.banner img,.banner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,var(--bg))}
.head{display:flex;gap:20px;align-items:flex-end;margin-top:-76px;position:relative;z-index:2;flex-wrap:wrap}
.av{width:150px;height:150px;padding:5px;border-radius:50%;flex:none;background:#555}
.av .im{width:100%;height:100%;border-radius:inherit;background:#1c1c20 center/cover;border:4px solid var(--bg)}
.f-ring{background:var(--si)}
.f-neon{background:#00e5ff;box-shadow:0 0 18px #00e5ff,0 0 44px #00e5ff77}
.f-gold{background:linear-gradient(135deg,#fff3b0,#d4a017,#fff3b0,#8a6a00)}
.f-fire{background:conic-gradient(#ff5e00,#ffd000,#ff2a6d,#ff5e00);animation:spin 4s linear infinite;box-shadow:0 0 22px #ff5e0088}
.f-fire .im{animation:spin 4s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.f-double{background:var(--bg);box-shadow:0 0 0 3px var(--si),0 0 0 8px var(--bg),0 0 0 11px #777}
.f-hex{border-radius:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:linear-gradient(135deg,#a855f7,#22d3ee)}
.f-hex .im{border-radius:0;clip-path:inherit;border:0}
.f-blue,.f-swirl,.f-crescent,.f-thorn{animation:spin 6s linear infinite}
.f-blue .im,.f-swirl .im,.f-crescent .im,.f-thorn .im{animation:spin 6s linear infinite reverse}
.f-blue{background:conic-gradient(#1e3cff,#8fb0ff,#4b1fa8,#1e3cff,#6a8dff,#1e3cff);box-shadow:0 0 18px #3b5bff,0 0 42px #3b5bff66}
.f-swirl{background:conic-gradient(from 0deg,transparent 0 12%,#00e5ff 35%,#0077b6 60%,transparent 78%,#00e5ff 92%,transparent);box-shadow:0 0 22px #00e5ff55}
.f-crescent{background:conic-gradient(from 200deg,transparent 0 28%,#fff 40%,#8a8a95 55%,#d9d9e0 70%,transparent 84%);filter:drop-shadow(0 0 6px #ffffff66)}
.f-thorn{background:conic-gradient(#ff2bd6,#4a0066,#ff2bd6,#2a0040,#ff2bd6);box-shadow:0 0 20px #ff2bd699;outline:2px dashed #ff2bd6;outline-offset:5px}
.f-crystal{position:relative;background:linear-gradient(#ff8a8a,#c1121f)}
.f-crystal:before{content:"";position:absolute;left:-6%;right:-6%;top:-22%;height:32%;background:linear-gradient(#ffc2c2,#e63946);clip-path:polygon(0 100%,8% 30%,16% 80%,26% 10%,36% 70%,50% 0,62% 70%,74% 15%,84% 80%,92% 30%,100% 100%);filter:drop-shadow(0 0 6px #ff4d4d)}
.f-none{background:transparent}
.who{flex:1;min-width:200px;padding-bottom:6px}
h1{margin:0;font:700 2.1rem "Cormorant Garamond",serif;letter-spacing:.06em}
.bio{color:var(--mu);margin:2px 0 0;white-space:pre-wrap}
h2{font-size:1.1rem;margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--ln);font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:18px}
.card video{width:100%;max-height:520px;background:#000;display:block}
.cb{padding:12px 14px}.cb h3{margin:0 0 8px;font-size:1rem;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{background:#1d1d21;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
button:hover{background:#2a2a30}.liked{background:var(--si);color:#111}
input,textarea,select{background:#0e0e10;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
.cm{border-top:1px solid var(--ln);margin-top:10px;padding-top:8px;font-size:.92rem}.cm b{color:var(--si)}.cm small{color:var(--mu)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.links a{display:block;padding:12px 14px;background:var(--card);border:1px solid var(--ln);border-radius:12px;color:var(--tx);text-decoration:none}
.links a:hover{border-color:#777}.links small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.x{color:#ff6b6b;border:0;background:none;padding:2px 6px}
.adm{background:#0f0f12;border:1px dashed #555;border-radius:14px;padding:14px;margin:18px 0}
.adm label{display:block;margin:12px 0 4px;color:var(--mu);font-size:.85rem}
.note{color:var(--mu);font-size:.85rem}
footer{text-align:center;color:var(--mu);margin-top:50px;font:500 .95rem "Cormorant Garamond",serif;letter-spacing:.1em}
footer button{background:#1d1d21;border:1px solid var(--ln);color:var(--tx);font-size:.9rem;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.avw{position:relative;width:150px;height:150px;flex:none;transition:transform .35s}
.avw:hover{transform:perspective(520px) rotateY(9deg) rotateX(-5deg)}
.deco{position:absolute;inset:-22%;pointer-events:none;z-index:3}
.deco svg{width:100%;height:100%;overflow:visible}
.av .im{box-shadow:0 12px 26px #000c,inset 0 2px 6px #ffffff22}
.f-ring{background:linear-gradient(135deg,#fff,#8e8e9a,#eeeef3,#666672);box-shadow:0 8px 18px #000b,inset 0 2px 3px #fffa}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.3s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.12,.78)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite reverse}
.card{box-shadow:0 20px 44px #000b,inset 0 1px 0 #ffffff14}
input,textarea{box-shadow:inset 0 3px 8px #000b}
.lk{position:relative;border:0;border-radius:14px;padding:10px 18px;font-weight:700;color:#fff;background:linear-gradient(180deg,#42424e,#1b1b22);box-shadow:0 6px 0 #0a0a0d,0 12px 20px #000a,inset 0 1px 0 #ffffff40;transition:transform .12s,box-shadow .12s}
.lk:hover{background:linear-gradient(180deg,#4c4c5a,#202028)}
.lk:active{transform:translateY(5px);box-shadow:0 1px 0 #0a0a0d,0 3px 8px #000a,inset 0 1px 0 #ffffff40}
.lk.sm{padding:9px 16px}
.lk.liked{background:linear-gradient(180deg,#ff7b97,#d11a48);box-shadow:0 6px 0 #7a0d28,0 12px 24px #ff2d5f66,inset 0 1px 0 #ffffff77;color:#fff}
.lk .h{display:inline-block;font-size:1.1em}
.lk.liked .h{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5) rotate(-10deg)}}
.cm{background:linear-gradient(145deg,#222229,#131317);border:1px solid #2e2e36;border-radius:16px;padding:10px 14px;margin-top:12px;box-shadow:7px 8px 16px #000a,-3px -3px 10px #ffffff0a,inset 0 1px 0 #ffffff18;transform:perspective(700px) rotateX(3deg);transition:transform .25s}
.cm:hover{transform:perspective(700px) rotateX(0) translateY(-3px)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:#222;color:#fff;border:1px solid #555;border-radius:12px;padding:10px 16px;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;font-size:.9rem}

#crop[hidden]{display:none}
.cbox{background:#131315;border:1px solid var(--ln);border-radius:18px;padding:14px;width:min(94vw,420px)}
#cv{position:relative;overflow:hidden;touch-action:none;background:#000;margin:auto;border-radius:12px;cursor:grab}
#cv.c{border-radius:50%}
#cimg{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
body{overflow-x:hidden}
.who{position:relative;z-index:4}
.fimg{width:100%;height:100%;display:block;transform-origin:50% 50%}
.fi-txt{animation:spin 26s linear infinite,glow 3s ease-in-out infinite alternate}
.fi-eclipse{animation:spin 70s linear infinite reverse,glow2 4s ease-in-out infinite alternate}
.fi-dragon{animation:spin 16s linear infinite,glow 3.5s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 3px #ffffff55)}to{filter:drop-shadow(0 0 12px #ffffffcc)}}
