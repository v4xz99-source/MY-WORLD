function cropImg(file,ratio,outW,circle){return new Promise(res=>{
 const m=$("crop"),cv=$("cv"),im=$("cimg"),z=$("cz"),W=Math.min(innerWidth*.84,360),H=W/ratio;
 cv.style.width=W+"px";cv.style.height=H+"px";cv.className=circle?"c":"";
 const url=URL.createObjectURL(file);let x=0,y=0,zm=1,s0=1,nw=0,nh=0,dr=null;
 const draw=()=>{const s=s0*zm;x=Math.min(0,Math.max(W-nw*s,x));y=Math.min(0,Math.max(H-nh*s,y));im.style.transform="translate("+x+"px,"+y+"px) scale("+s+")"};
 im.onload=()=>{nw=im.naturalWidth;nh=im.naturalHeight;s0=Math.max(W/nw,H/nh);zm=1;z.value=1;x=(W-nw*s0)/2;y=(H-nh*s0)/2;draw()};
 im.src=url;m.hidden=false;
 cv.onpointerdown=e=>{dr={px:e.clientX,py:e.clientY,x,y};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!dr)return;x=dr.x+e.clientX-dr.px;y=dr.y+e.clientY-dr.py;draw()};
 cv.onpointerup=cv.onpointercancel=()=>{dr=null};
 z.oninput=()=>{const o=s0*zm,cx=(W/2-x)/o,cy=(H/2-y)/o;zm=+z.value;const s=s0*zm;x=W/2-cx*s;y=H/2-cy*s;draw()};
 const done=v=>{m.hidden=true;URL.revokeObjectURL(url);res(v)};
 $("cno").onclick=()=>done(null);
 $("cok").onclick=()=>{const s=s0*zm,c=document.createElement("canvas");c.width=outW;c.height=Math.round(outW/ratio);c.getContext("2d").drawImage(im,-x/s,-y/s,W/s,H/s,0,0,c.width,c.height);c.toBlob(b=>done(b),"image/jpeg",.9)};
})}

 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,"a");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const uT=gl.getUniformLocation(pr,"t");gl.uniform1f(gl.getUniformLocation(pr,"m"),mode);gl.uniform1f(gl.getUniformLocation(pr,"ar"),ar);
 const tex=gl.createTexture();let ready=false;
 const draw=t=>{if(!ready)return;gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(uT,t);gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_SHORT,0)};
 const im=new Image();
 im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  ready=true;draw(0)};
 im.src=src;
 return{draw}
}
function applyFrame(fr){
 if(applyFrame.last===fr)return;applyFrame.last=fr;
 const D=DECO[fr],I=IMGF[fr],B=$("decoB"),F=$("deco"),X=$("fxw");
 $("av").className="av f-"+(D||I?"none":fr);
 B.innerHTML="";F.innerHTML="";X.style.display="none";FX.cfg=null;FX.ps=[];$("avw").style.margin="";WARPS.length=0;
 [B,F,X].forEach(e=>e.style.inset="");
 if(D){F.innerHTML=D();return}
 if(!I)return;
 const w=150*I.k,h=w*(I.a||1);
 [B,F,X].forEach(e=>e.style.inset=(-(h-150)/2)+"px "+(-(w-150)/2)+"px");
 if(I.pad)$("avw").style.margin="0 "+I.pad+"px";
 const mk=(clip,cls)=>{
  if(I.warp!==undefined){const c=document.createElement("canvas");c.className="fimg "+(cls||"fi-"+fr);if(clip)c.style.clipPath=clip;const wp=makeWarp(c,I.src,I.warp,I.a||1,w);if(wp){WARPS.push(wp);return c}}
  const i=document.createElement("img");i.className="fimg "+(cls||"fi-"+fr);i.src=I.src;i.alt="";if(clip)i.style.clipPath=clip;return i};
 if(I.mode==="back")B.append(mk());
 else if(I.mode==="double"){B.append(mk(0,"rg"));F.append(mk())}
 else if(I.wrap){const cl=I.cls||[];B.append(mk(I.wrap[1],cl[1]));F.append(mk(I.wrap[0],cl[0]))}
 else F.append(mk());
 if(I.fx&&!RM){const c=$("fx"),dpr=Math.min(window.devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);FX.k=I.k;FX.cfg=I.fx;X.style.display="block"}
}
document.addEventListener("pointermove",e=>{const r=$("avw").getBoundingClientRect();FX.px=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/260));FX.py=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/260))});
function frameLoop(ts){
 requestAnimationFrame(frameLoop);
 const t=ts/1000,dt=Math.min(.05,Math.max(.001,t-FX.last));FX.last=t;
 if(RM)return;
 WARPS.forEach(w=>w.draw(t));
 FX.px*=.995;FX.py*=.995;
 const av=$("avw");
 av.style.setProperty("--ry",(Math.sin(t*.5)*8+FX.px*9).toFixed(2)+"deg");
 av.style.setProperty("--rx",(Math.sin(t*.7)*3.5-FX.py*7).toFixed(2)+"deg");
 const cfg=FX.cfg;if(!cfg)return;
 const c=$("fx"),g=c.getContext("2d"),W=c.width,H=c.height,u=W/(150*FX.k);
 g.clearRect(0,0,W,H);g.globalCompositeOperation="lighter";
 if(cfg.type==="sparks"){
  if(Math.random()<.35){const a=Math.random()*6.283,r=cfg.r*W*(.97+Math.random()*.06);FX.ps.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:(Math.cos(a+1.57)*6+Math.cos(a)*5*Math.random())*u,vy:(Math.sin(a+1.57)*6+Math.sin(a)*5*Math.random())*u,age:0,life:1.4+Math.random()*1.2,sz:(1.2+Math.random()*1.8)*u,tw:Math.random()*6})}
  FX.ps=FX.ps.filter(p=>(p.age+=dt)<p.life);
  for(const p of FX.ps){p.x+=p.vx*dt;p.y+=p.vy*dt;const al=Math.max(0,Math.sin(p.age/p.life*Math.PI)*(.6+.4*Math.sin(p.age*9+p.tw))),r=p.sz*3,gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
   gr.addColorStop(0,"rgba(220,255,240,"+al+")");gr.addColorStop(.4,"rgba(120,255,200,"+(al*.5)+")");gr.addColorStop(1,"rgba(120,255,200,0)");g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r,0,7);g.fill()}
  return}
 const firing=(t%6)<1.8,n=firing?Math.ceil(120*dt):(Math.random()<.12?1:0);
 for(let i=0;i<n;i++){const a=(cfg.dir+(Math.random()-.5)*28)*Math.PI/180,sp=(firing?90+Math.random()*70:15+Math.random()*15)*u;FX.ps.push({x:cfg.x*W,y:cfg.y*H,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:firing?.55+Math.random()*.4:.8,sz:(firing?3:1.5)*u})}
 FX.ps=FX.ps.filter(p=>(p.age+=dt)<p.life);
 for(const p of FX.ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=40*u*dt;const a=p.age/p.life,r=p.sz*(1+a*3.2),al=1-a;
  const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);gr.addColorStop(0,"rgba(255,240,170,"+(.9*al)+")");gr.addColorStop(.4,"rgba(255,140,30,"+(.6*al)+")");gr.addColorStop(1,"rgba(255,60,0,0)");
  g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r,0,7);g.fill()}
}
requestAnimationFrame(frameLoop);

let VS=[],VE=false;
const SRC={instagram:["instagram.com"],facebook:["facebook.com","fb.com","fb.me"],tiktok:["tiktok.com"],youtube:["youtube.com","youtu.be"],telegram:["t.me","telegram.org","telegram.me"],whatsapp:["whatsapp.com","wa.me"],x:["x.com","twitter.com","t.co"],snapchat:["snapchat.com"],linkedin:["linkedin.com","lnkd.in"],reddit:["reddit.com"],google:["google.com"],github:["github.com"],discord:["discord.com","discord.gg"],pinterest:["pinterest.com"],threads:["threads.net"]};
const NAME={instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok",youtube:"YouTube",telegram:"Telegram",whatsapp:"WhatsApp",x:"X",snapchat:"Snapchat",linkedin:"LinkedIn",reddit:"Reddit",google:"Google",github:"GitHub",discord:"Discord",pinterest:"Pinterest",threads:"Threads",direct:"زيارة مباشرة (مصدر غير معروف)"};
const label=k=>NAME[k]||k;
function devOf(){const u=navigator.userAgent;return /Android/i.test(u)?"Android":/iPhone|iPad|iPod/i.test(u)?"iOS":/Windows/i.test(u)?"Windows":/Mac/i.test(u)?"Mac":/Linux/i.test(u)?"Linux":"جهاز"}
function srcOf(){
 const q=new URLSearchParams(location.search),f=(q.get("from")||q.get("utm_source")||q.get("src")||"").toLowerCase().replace(/[^a-z0-9._-]/g,"").slice(0,30);
 if(f)return{source:f,ref:""};
 let h="";try{h=new URL(document.referrer).hostname.replace(/^www\./,"")}catch(e){}
 if(!h||h===location.hostname)return{source:"direct",ref:""};
 for(const k in SRC)if(SRC[k].some(d=>h===d||h.endsWith("."+d)))return{source:k,ref:h};
 return{source:h.slice(0,40),ref:h.slice(0,150)}
}
async function logVisit(){
 if(owner||sessionStorage.getItem("lv"))return;sessionStorage.setItem("lv","1");
 const x=srcOf();
 try{await sb.from("visits").insert({visitor_id:vis,source:x.source,referrer:x.ref,device:devOf(),name:localStorage.getItem("nm")||null})}catch(e){}
}
const vico=k=>{const d=SRC[k]?SRC[k][0]:(k.includes(".")?k:"");return d?'<img class="ico" src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=64" alt="" onerror="this.remove()">':'<span style="width:26px;text-align:center">🔗</span>'};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);return m<1?"دلوقتي":m<60?"من "+m+" دقيقة":m<1440?"من "+Math.round(m/60)+" ساعة":"من "+Math.round(m/1440)+" يوم"};

async function loadVisits(){const r=await sb.from("visits").select().order("created_at",{ascending:false}).limit(300);VE=!!r.error;VS=r.data||[];badge();if(!$("vmodal").hidden)showVisits()}

 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 $("vlist").innerHTML=VE?'<p class="note">شغّل كود SQL الخاص بالزوار في Supabase أولًا.</p>':
  '<p class="note" style="margin:0 0 6px">اليوم: <b>'+today+'</b> • الكل: <b>'+VS.length+'</b>'+(top?' • الأكثر: <b>'+esc(label(top[0]))+'</b>':'')+'</p>'+
  (VS.length?VS.map(v=>'<div class="vrow">'+vico(v.source)+'<div style="flex:1"><b>'+esc(label(v.source))+'</b><small>'+esc(v.device||"")+' • زائر #'+esc((v.visitor_id||"").slice(0,4))+(vc[v.visitor_id]>1?' ('+vc[v.visitor_id]+' زيارات)':'')+(v.name?' • '+esc(v.name):'')+'</small></div><small>'+ago(v.created_at)+'</small></div>').join(""):'<p class="note">مفيش زيارات لسه.</p>')
}
